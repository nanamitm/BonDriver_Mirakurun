name: Build x64 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # The build embeds `git describe --tags`, which needs the history and tags.
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build (Release|x64)
        run: msbuild BonDriver_Mirakurun.sln /p:Configuration=Release /p:Platform=x64 /m

      # ドライバのスレッド・HTTP処理の回帰テスト (変換器と録画は代用品)。
      # Mirakurun、チューナー、スマートカードは不要。
      - name: Run driver safety tests
        shell: pwsh
        run: ./tests/run-driver-safety.ps1

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "x64\Release\BonDriver_Mirakurun.dll" $dist
          Copy-Item "BonDriver_Mirakurun.ini" $dist
          Copy-Item "README.md" $dist
          Copy-Item "LICENSE" $dist
          Compress-Archive -Path "$dist\*" -DestinationPath "BonDriver_Mirakurun_x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BonDriver_Mirakurun_x64
          path: BonDriver_Mirakurun_x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: BonDriver_Mirakurun_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
